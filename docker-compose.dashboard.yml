# Run with: docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d --build
services:
  bot:
    command: ["uv", "run", "python", "main.py", "--dashboard", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env (at least 12 characters)}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
