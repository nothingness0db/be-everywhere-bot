services:
  bot:
    build: .
    container_name: be-everywhere-bot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Persists credentials + sync state (data/be_everywhere.db)
      - ./data:/app/data
      - ./routing.toml:/app/routing.toml:ro

    # Default: TG prefix routing, polling every 5 seconds (routing.toml).
    # Migrations run automatically on every start (including watch, --auth, --since).
    # To migrate without starting sync:
    # Override for one-off tasks, e.g.:
    #   docker compose run --rm bot uv run python main.py --auth=twitter
    #   docker compose run --rm bot uv run python main.py --auth=telegram
    #   docker compose run --rm bot uv run python main.py --auth=bilibili
    #   docker compose run --rm bot uv run python main.py --auth=mastodon
    #   docker compose run --rm bot uv run python main.py --auth=threads
    #   docker compose run --rm bot uv run python main.py --auth=bluesky
    #   docker compose run --rm bot uv run python main.py --auth=rss
    #   docker compose run --rm bot uv run python main.py --since=2026-01-01
